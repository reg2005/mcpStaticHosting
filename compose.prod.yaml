# Production stack with bundled Nginx and automatic DNS-01 / HTTP-01 certificates.
# sh scripts/setup.sh --production
# Edit .env.production, then:
# docker compose --env-file .env.production -f compose.prod.yaml up -d --wait
name: ${COMPOSE_PROJECT_NAME:-mcp-static-hosting-production}

x-env: &env
  NODE_ENV: production
  DATABASE_URL: postgres://mcphosting:${POSTGRES_PASSWORD:?Run sh scripts/setup.sh}@postgres:5432/mcphosting
  REDIS_URL: redis://redis:6379
  APP_SECRET: ${APP_SECRET:?Run sh scripts/setup.sh}
  SITE_ROUTING_MODE: ${SITE_ROUTING_MODE:-subdomain}
  MAIN_DOMAIN: ${MAIN_DOMAIN:?Set MAIN_DOMAIN}
  AUTH_BASE_URL: https://${MAIN_DOMAIN:?Set MAIN_DOMAIN}
  MCP_PUBLIC_URL: https://${MAIN_DOMAIN:?Set MAIN_DOMAIN}/mcp
  PUBLIC_BASE_DOMAIN: ${MAIN_DOMAIN:?Set MAIN_DOMAIN}
  PUBLIC_SITE_SCHEME: https
  PUBLIC_SITE_PORT: ""
  REPO_ROOT: /data/repos
  SNAPSHOT_ROOT: /data/snapshots
  JSON_DATA_ROOT: /data/json-db
  SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-MCP Static Hosting <noreply@example.com>}
  FUNCTIONS_URL: http://functions:3003
  FUNCTIONS_ENABLED: ${FUNCTIONS_ENABLED:-false}
  MCP_RATE_LIMIT_PER_MIN: ${MCP_RATE_LIMIT_PER_MIN:-600}

x-app: &app
  platform: linux/amd64
  image: reg2005/mcp-static-hosting:${IMAGE_TAG:-0.3.0}
  environment: *env
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 1g
  volumes: [sites:/data]
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

x-health: &health
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 40s

services:
  edge:
    platform: linux/amd64
    image: reg2005/mcp-static-hosting-edge:${IMAGE_TAG:-0.3.0}
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    ports: ['80:8080', '443:8443']
    environment:
      DATABASE_URL: postgres://mcphosting:${POSTGRES_PASSWORD:?Run sh scripts/setup.sh}@postgres:5432/mcphosting
      SITE_ROUTING_MODE: ${SITE_ROUTING_MODE:-subdomain}
      MAIN_DOMAIN: ${MAIN_DOMAIN:?Set MAIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      ACME_SERVER: ${ACME_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      DNS_PROVIDER: ${DNS_PROVIDER:-}
      DNS_CREDENTIALS_FILE: /run/secrets/dns_credentials
      PUBLIC_IPV4: ${PUBLIC_IPV4:-}
      PUBLIC_IPV6: ${PUBLIC_IPV6:-}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-1.1.1.1,8.8.8.8}
      MANAGEMENT_ALLOWED_CIDRS: ${MANAGEMENT_ALLOWED_CIDRS:-}
    volumes: [edge:/edge]
    secrets: [dns_credentials]
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_healthy
      mcp:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcphosting
      POSTGRES_DB: mcphosting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/setup.sh}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mcphosting -d mcphosting']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [pnpm, --filter, '@mcphosting/db', migrate]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *app
    command: [pnpm, --filter, '@mcphosting/web', start]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  mcp:
    <<: *app
    command: [pnpm, --filter, '@mcphosting/mcp', start]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  router:
    <<: *app
    command: [pnpm, --filter, '@mcphosting/router', start]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  functions:
    platform: linux/amd64
    image: reg2005/mcp-static-hosting-functions:${IMAGE_TAG:-0.3.0}
    profiles: [functions]
    user: '1000:1000'
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    environment:
      REDIS_URL: redis://redis:6379
      JSON_DATA_ROOT: /data/json-db
      FUNCTION_TIMEOUT_MS: ${FUNCTION_TIMEOUT_MS:-10000}
    volumes: [sites:/data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: [CMD, deno, eval, "const r=await fetch('http://127.0.0.1:3003/healthz');Deno.exit(r.ok?0:1)"]
secrets:
  dns_credentials:
    file: ${DNS_CREDENTIALS_PATH:-/dev/null}

volumes:
  edge:
  sites:
  postgres:
  redis:
