name: Bug report
description: Report a reproducible problem
title: 'bug: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Expected and actual behavior. Do not include secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image version, OS and CPU architecture
    validations:
      required: true
