name: Publish Docker Hub images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (for example 0.1.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mcp-static-hosting:${{ inputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/mcp-static-hosting:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v7
        with:
          context: ./apps/functions
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mcp-static-hosting-functions:${{ inputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/mcp-static-hosting-functions:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
